name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ master, main ]
    paths:
      - 'slides/**'
      - '.github/workflows/deploy-slides.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'slides/package-lock.json'

      - name: Install dependencies
        working-directory: ./slides
        run: npm ci

      - name: Build slides
        working-directory: ./slides
        # GitHub Pages のルート (/) ではなく、/<リポジトリ名>/ で公開されるため、動的に base を設定する
        run: npx slidev build --base /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'slides/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
